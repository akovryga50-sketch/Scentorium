<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сторінку не знайдено — Scentorium</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Спеціальні стилі для сторінки помилки */
        body {
            background-color: #0a0a0a;
            color: #fff;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .error-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 20px;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 300;
            color: #fff;
            margin: 0;
            letter-spacing: 10px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }
        .error-message {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 40px;
            max-width: 500px;
            line-height: 1.6;
        }
        .error-btn {
            display: inline-block;
            padding: 15px 35px;
            background-color: #fff;
            color: #000;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            border: 1px solid #fff;
        }
        .error-btn:hover {
            background-color: #000;
            color: #fff;
        }
        /* Мінімалістична шапка для цієї сторінки */
        .simple-header {
            padding: 30px 0;
            text-align: center;
            border-bottom: 1px solid #222;
        }
        .simple-header a {
            color: #fff;
            text-decoration: none;
            font-size: 24px;
            letter-spacing: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header class="simple-header">
        <a href="index.html">SCENTORIUM</a>
    </header>

    <div class="error-container">
        <h1 class="error-code">404</h1>
        <p class="error-message">
            Цей аромат вже випарувався... або такої сторінки ніколи не існувало.<br>
            Ольфакторний шлейф обірвався, але ми допоможемо знайти новий шлях.
        </p>
        <a href="catalog.html" class="error-btn">Повернутися до каталогу</a>
    </div>

</body>
</html>
