<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scentorium - Контакти</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .content-container { max-width: 800px; margin: 40px auto; padding: 40px; background-color: #111; border: 1px solid #333; }
        .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 30px; }
        .info-box h3 { color: #fff; margin-bottom: 10px; font-size: 16px; text-transform: uppercase; }
        .info-box p { color: #aaa; margin-bottom: 25px; line-height: 1.6; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: #fff; margin-bottom: 5px; font-size: 14px; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px; background-color: #000; border: 1px solid #444; color: #fff; outline: none; font-family: inherit;
        }
        .submit-btn {
            background-color: #fff; color: #000; padding: 12px 25px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s;
        }
        .submit-btn:hover { background-color: #ccc; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="top-links">
            <a href="about.html">Про магазин (Автора)</a>
            <a href="delivery.html">Оплата та доставка</a>
            <a href="blog.html">Блог</a>
            <a href="contacts.html">Контакти</a>
        </div>
    </div>

    <header class="main-header">
        <div class="logo"><a href="index.html" style="color: white;">SCENTORIUM</a></div>
    </header>

    <div class="content-container">
        <h1 style="text-align: center;">Зв'яжіться з нами</h1>
        
        <div class="contact-grid">
            <div>
                <div class="info-box">
                    <h3>Адреса бутіка</h3>
                    <p>м. Дніпро<br>Студентське містечко ДІІТ</p>
                </div>
                <div class="info-box">
                    <h3>Контакти</h3>
                    <p>Телефон: +380 (67) 000 0000<br>Email: info@scentorium.com.ua</p>
                </div>
                <div class="info-box">
                    <h3>Графік роботи</h3>
                    <p>Пн - Пт: 10:00 - 20:00<br>Сб - Нд: 11:00 - 18:00</p>
                </div>
            </div>

            <div>
                <form action="#" method="post">
                    <div class="form-group">
                        <label>Ваше ім'я</label>
                        <input type="text" placeholder="Олексій" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" placeholder="example@mail.com" required>
                    </div>
                    <div class="form-group">
                        <label>Повідомлення</label>
                        <textarea rows="5" placeholder="Напишіть ваше питання..." required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Відправити</button>
                </form>
            </div>
        </div>
    </div>

    <footer class="main-footer">
        <div class="footer-bottom"><p>© 2026 Scentorium.</p></div>
    </footer>
</body>
</html>
